name: Deploy Angular frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: xiaojuanschoolpayment.client/package-lock.json

      - name: Install dependencies
        working-directory: xiaojuanschoolpayment.client
        run: npm ci

      - name: Build Angular app
        working-directory: xiaojuanschoolpayment.client
        run: npm run build

      - name: Configure GitHub Pages base path
        working-directory: xiaojuanschoolpayment.client/dist/xiaojuanschoolpayment.client/browser
        run: sed -i 's|<base href="/">|<base href="/XiaoJuanSchoolPayment/">|' index.html index.csr.html

      # index.html is the prerendered home page; index.csr.html is the empty shell for every other route.
      - name: Support direct links for Angular routes
        working-directory: xiaojuanschoolpayment.client/dist/xiaojuanschoolpayment.client/browser
        run: cp index.csr.html 404.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: xiaojuanschoolpayment.client/dist/xiaojuanschoolpayment.client/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
