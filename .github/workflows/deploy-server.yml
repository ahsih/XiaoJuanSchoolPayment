name: Deploy production server

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-server
  cancel-in-progress: false

jobs:
  deploy:
    # Only ever deploy main, including manual runs.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      # The runner fetches from GitHub and pushes to the server over SSH, so the
      # production server never needs to reach GitHub or a third-party mirror.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # Every --build leaves BuildKit cache and an untagged previous app image.
      # Without pruning they fill the server disk, after which git push and
      # docker builds fail. Cache still reused within 24 hours is kept so
      # unchanged npm/NuGet restore layers stay fast, unless free space is still
      # under 10 GB: a day with many deploys once left 44 GB of fresh cache and
      # 2.4 GB free. Then all unused build cache goes; the next build is slower
      # but containers, images and volumes are untouched.
      - name: Free server disk space
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes "$SERVER_USER@$SERVER_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          df -h /opt/sida
          sudo -n docker builder prune -f --filter until=24h || echo "Build-cache prune failed; continuing." >&2
          sudo -n docker image prune -f || echo "Dangling-image prune failed; continuing." >&2
          low_kb=$((10 * 1024 * 1024))
          if [ "$(df --output=avail -k /opt/sida | tail -n 1 | tr -d ' ')" -lt "$low_kb" ]; then
            sudo -n docker builder prune -af || echo "Full build-cache prune failed; continuing." >&2
          fi
          df -h /opt/sida

          min_free_kb=$((3 * 1024 * 1024))
          free_kb="$(df --output=avail -k /opt/sida | tail -n 1 | tr -d ' ')"
          if [ "$free_kb" -lt "$min_free_kb" ]; then
            echo "Less than 3 GB free on the server after cleanup; deploy stopped before pushing or building." >&2
            sudo -n docker system df >&2 || true
            exit 1
          fi
          REMOTE

      - name: Push commit to production server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          GIT_SSH_COMMAND: ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes
        run: |
          # "deploy" is a transport branch in the server's working repository;
          # the checked-out main branch is fast-forwarded in the next step.
          # New files go first in batches of about 50 MB, so a push that runs
          # into GitHub's 6-hour job limit keeps the batches that arrived and
          # the next run continues from there (see the script).
          bash .github/scripts/push-in-batches.sh "ssh://$SERVER_USER@$SERVER_HOST/opt/sida/app" "$GITHUB_SHA"

      - name: Update production server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes "$SERVER_USER@$SERVER_HOST" bash -se "$GITHUB_SHA" <<'REMOTE'
          set -Eeuo pipefail
          target_sha="$1"
          cd /opt/sida/app

          current_branch="$(git symbolic-ref --short HEAD)"
          if [ "$current_branch" != "main" ]; then
            echo "Server checkout is on '$current_branch', expected 'main'." >&2
            exit 1
          fi

          git merge --ff-only "$target_sha"
          test "$(git rev-parse HEAD)" = "$target_sha"

          sudo -n docker compose --env-file /opt/sida/.env -f compose.production.yml up -d --build app caddy
          sudo -n docker compose --env-file /opt/sida/.env -f compose.production.yml ps

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          sudo -n docker compose --env-file /opt/sida/.env -f compose.production.yml logs --tail=100 app caddy
          exit 1
          REMOTE
