<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>菲律宾游学前60天英语学习计划 | 思达启航</title>
<meta name="description" content="思达启航菲律宾游学前60天英语学习计划：生活英语、课堂英语、开口表达和入学测试准备。">
<style>
/* Layout: one phone-width column (max 680px). Home = flight-route progress + stage drawers; lesson = 7 numbered steps with a sticky day bar.
   Palette follows the 思达启航 deck: deep green, warm orange, mint and peach surfaces on a light cream page. */
:root {
  --page: #FBF8F2;
  --card: #FFFFFF;
  --ink: #18362D;
  --muted: #5D6B65;
  --line: #E4E5DD;
  --green: #064C39;
  --green-2: #14705A;
  --on-green: #FFFFFF;
  --accent: #D9561C;
  --accent-fill: #F26B2D;
  --mint: #E8F1EC;
  --peach: #FBE7D8;
  --right: #1F7A4D;
  --right-bg: #E3F3E9;
  --wrong: #B5381B;
  --wrong-bg: #FBE3DC;
  --t-noun: #2F6694; --t-noun-bg: #E5EEF6;
  --t-verb: #B4491A; --t-verb-bg: #FCE9DE;
  --t-adj: #6D4FAA; --t-adj-bg: #EEE8F8;
  --t-link: #1F7A4D; --t-link-bg: #E3F3E9;
  --t-other: #5D6B65; --t-other-bg: #ECEEE9;
  --t-adv: #9A3A6B; --t-adv-bg: #F8E6EF;
  --shadow: 0 1px 2px rgba(6, 76, 57, .06), 0 4px 14px rgba(6, 76, 57, .06);
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", Roboto, sans-serif;
  --num: "DIN Alternate", "Bahnschrift", "Avenir Next Condensed", -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
  --track: rgba(255, 255, 255, .25);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0E1613; --card: #16221D; --ink: #E3EDE8; --muted: #9DAEA6; --line: #26362F;
    --green: #8FD6B6; --green-2: #6CC29E; --on-green: #062B20;
    --accent: #FF9466; --accent-fill: #F2733A; --mint: #19302A; --peach: #3A271C;
    --right: #7FD8A6; --right-bg: #173327; --wrong: #FF9C83; --wrong-bg: #3A1F18;
    --t-noun: #9CC6EE; --t-noun-bg: #1B2B3A; --t-verb: #FFAE86; --t-verb-bg: #37241A;
    --t-adj: #C7B3F2; --t-adj-bg: #2A2340; --t-link: #8EDDB2; --t-link-bg: #173327;
    --t-other: #AEBBB5; --t-other-bg: #222E29;
    --t-adv: #F1A6CB; --t-adv-bg: #3A2030;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
    --track: rgba(6, 43, 32, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0E1613; --card: #16221D; --ink: #E3EDE8; --muted: #9DAEA6; --line: #26362F;
  --green: #8FD6B6; --green-2: #6CC29E; --on-green: #062B20;
  --accent: #FF9466; --accent-fill: #F2733A; --mint: #19302A; --peach: #3A271C;
  --right: #7FD8A6; --right-bg: #173327; --wrong: #FF9C83; --wrong-bg: #3A1F18;
  --t-noun: #9CC6EE; --t-noun-bg: #1B2B3A; --t-verb: #FFAE86; --t-verb-bg: #37241A;
  --t-adj: #C7B3F2; --t-adj-bg: #2A2340; --t-link: #8EDDB2; --t-link-bg: #173327;
  --t-other: #AEBBB5; --t-other-bg: #222E29;
  --t-adv: #F1A6CB; --t-adv-bg: #3A2030;
  --shadow: 0 1px 2px rgba(0,0,0,.3);
  --track: rgba(6, 43, 32, .25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--page); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--page); }
#app { max-width: 680px; margin: 0 auto; padding-block: 8px 48px; }
a { color: var(--green-2); }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.3; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent-fill); outline-offset: 2px; border-radius: 6px; }
img { max-width: 100%; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.label { display: block; font-size: 12.5px; font-weight: 700; letter-spacing: .06em; color: var(--accent); }
.en { font-weight: 600; }
svg { width: 20px; height: 20px; display: block; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 18px; border-radius: 12px; border: 1px solid transparent; font-weight: 700; text-decoration: none; cursor: pointer; font-size: 15.5px; }
.btn-primary { background: var(--green); color: var(--on-green); }
.btn-light { background: var(--card); color: var(--green); border-color: var(--line); }
.btn-ghost { background: var(--mint); color: var(--green); }
.btn-wide { width: 100%; margin-top: 12px; }
.btn-big { flex-direction: column; align-items: flex-start; width: 100%; padding: 14px 18px; gap: 2px; }
.bb-k { font-size: 13px; font-weight: 700; letter-spacing: .06em; opacity: .85; font-family: var(--num); }
.bb-t { font-size: 18px; }
.speak { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--mint); color: var(--green); display: inline-grid; place-items: center; cursor: pointer; vertical-align: middle; margin-left: 6px; }
.speak svg { width: 18px; height: 18px; }

/* brand + hero */
.brand { display: flex; align-items: center; gap: 10px; padding-block: 8px 14px; }
.brand img { width: 40px; height: 40px; }
.brand b { display: block; color: var(--green); font-size: 17px; line-height: 1.2; }
.brand span { display: block; font-size: 10.5px; letter-spacing: .08em; color: var(--muted); }
.brand-link { margin-left: auto; font-size: 14px; font-weight: 700; text-decoration: none; padding: 6px 12px; border-radius: 999px; background: var(--mint); color: var(--green); }
.hero { background: var(--green); color: var(--on-green); border-radius: 20px; padding: 22px 18px 18px; display: grid; gap: 10px; }
.hero .eyebrow { font-size: 14px; font-weight: 700; opacity: .85; }
.hero h1 { font-size: 34px; letter-spacing: .02em; }
.hero-sub { font-size: 15px; opacity: .9; }
.hero .btn-primary { background: var(--page); color: var(--green); margin-top: 6px; }
.route { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 13px; font-weight: 700; }
.rt-track { position: relative; flex: 1; height: 6px; border-radius: 3px; background: var(--track); }
.rt-fill { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--accent-fill); }
.rt-plane { position: absolute; top: 50%; transform: translate(-50%, -50%) rotate(90deg); color: var(--on-green); }
.rt-plane svg { width: 22px; height: 22px; }
.route-cap { font-size: 14px; opacity: .9; font-variant-numeric: tabular-nums; }
.route-cap b { font-family: var(--num); font-size: 20px; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.review { margin-top: 14px; display: grid; gap: 8px; border-color: var(--accent-fill); }
.review h2 { font-size: 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 7px 12px; border-radius: 999px; background: var(--peach); color: var(--ink); text-decoration: none; font-size: 14px; font-weight: 600; }

.sec { margin-top: 26px; }
.sec-h { font-size: 19px; margin-bottom: 10px; }
.hscroll { display: grid; grid-auto-flow: column; grid-auto-columns: 150px; gap: 10px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x mandatory; }
.pcard { scroll-snap-align: start; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 12px; min-height: 104px; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; text-decoration: none; color: var(--ink); font-weight: 700; font-size: 15px; line-height: 1.4; }
.pc-n { font-family: var(--num); color: var(--accent); font-size: 14px; }

/* stages */
.stage { margin-top: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.stage summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 96px 1fr; min-height: 112px; }
.stage summary::-webkit-details-marker { display: none; }
.st-img { background-size: cover; background-position: center; }
.st-text { padding: 12px 14px; display: grid; gap: 2px; align-content: center; min-width: 0; }
.st-code { font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--accent); font-family: var(--num); }
.st-title { font-size: 19px; font-weight: 800; color: var(--green); }
.st-desc { font-size: 13.5px; color: var(--muted); line-height: 1.45; }
.st-count { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stage[open] summary { border-bottom: 1px solid var(--line); }
.st-list { padding: 6px 10px 10px; display: grid; gap: 4px; }
.day-row { display: grid; grid-template-columns: 64px 1fr 28px; gap: 12px; align-items: center; padding: 8px 6px; border-radius: 12px; text-decoration: none; color: var(--ink); }
.day-row img { width: 64px; height: 57px; object-fit: cover; border-radius: 10px; }
.dr-text { display: grid; min-width: 0; }
.dr-day { font-family: var(--num); font-size: 12.5px; font-weight: 700; color: var(--muted); letter-spacing: .05em; }
.dr-title { font-weight: 700; font-size: 15.5px; line-height: 1.35; }
.dr-state { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; color: var(--on-green); }
.dr-state svg { width: 15px; height: 15px; }
.day-row.done .dr-state { background: var(--green-2); border-color: var(--green-2); }
.day-row.next { background: var(--mint); }
.day-row.next .dr-day { color: var(--green-2); }
.mini-row { display: flex; align-items: baseline; gap: 10px; padding: 10px 12px; border-radius: 12px; text-decoration: none; color: var(--ink); font-weight: 700; font-size: 15px; background: var(--page); border: 1px dashed var(--line); }
.mini-row .mr-k { flex: none; font-size: 12px; letter-spacing: .04em; color: var(--accent); }
.mini-row.lv { background: var(--peach); border-style: solid; border-color: transparent; }
.mini-row.pg .mr-k { color: var(--green-2); }
.tl-note { font-size: 13.5px; color: var(--muted); padding: 6px 6px 2px; }

.tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tool { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; text-decoration: none; color: var(--ink); font-weight: 700; font-size: 14.5px; line-height: 1.4; }

.contact { margin-top: 26px; background: var(--green); color: var(--on-green); border-radius: 20px; padding: 20px 18px; display: grid; gap: 14px; }
.contact h2 { font-size: 19px; }
.ct-row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.ct-row img { width: 132px; height: auto; border-radius: 10px; background: #fff; padding: 6px; }
.ct-text { display: grid; gap: 8px; min-width: 0; }
.ct-k { font-size: 13px; font-weight: 700; opacity: .85; letter-spacing: .04em; }
.ct-phone { font-family: var(--num); font-size: 26px; font-weight: 700; letter-spacing: .04em; user-select: all; font-variant-numeric: tabular-nums; }
.ct-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.contact .btn-light { min-height: 40px; padding: 6px 14px; font-size: 14px; }
.ct-web a { color: var(--on-green); font-weight: 700; }
.ct-list { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 14.5px; }
.foot { margin-top: 18px; font-size: 12.5px; color: var(--muted); text-align: center; }

/* top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 8px; background: var(--page); padding-block: 8px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.back { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; color: var(--green); background: var(--card); border: 1px solid var(--line); flex: none; }
.tb-text { min-width: 0; }
.tb-sub { font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: .04em; font-family: var(--num); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-title { font-size: 17px; font-weight: 800; color: var(--green); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* lesson */
.lesson { display: grid; gap: 14px; }
.banner { background: var(--peach); border-radius: var(--r); padding: 14px; display: grid; gap: 8px; }
.step { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 12px; }
.step-h { display: flex; align-items: center; gap: 10px; }
.step-h h2 { font-size: 18px; color: var(--green); }
.num { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--accent-fill); color: #fff; font-family: var(--num); font-weight: 700; display: grid; place-items: center; font-size: 15px; }
.scene { display: grid; grid-template-columns: 116px 1fr; gap: 12px; align-items: center; }
.scene img { width: 116px; height: 104px; object-fit: cover; border-radius: 12px; }
.scene-goal { font-weight: 700; font-size: 16.5px; line-height: 1.45; }
.try { background: var(--mint); border-radius: 12px; padding: 12px; display: grid; gap: 4px; }
.try-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.try .en { font-size: 19px; }

.player { display: grid; grid-template-columns: 48px 1fr auto; gap: 10px; align-items: center; background: var(--mint); border-radius: 14px; padding: 10px 12px; }
.pl-btn { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--green); color: var(--on-green); display: grid; place-items: center; cursor: pointer; }
.pl-btn svg { width: 24px; height: 24px; }
.pl-main { min-width: 0; display: grid; gap: 2px; }
.pl-title { font-weight: 700; font-size: 14.5px; }
.pl-bar { width: 100%; accent-color: var(--accent-fill); margin: 2px 0; }
.pl-meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pl-opts { display: grid; gap: 6px; }
.pl-rate, .pl-loop { min-width: 44px; height: 32px; border-radius: 9px; border: 1px solid var(--line); background: var(--card); color: var(--green); font-weight: 700; font-size: 13px; cursor: pointer; display: grid; place-items: center; font-family: var(--num); }
.pl-loop svg { width: 18px; height: 18px; }
.pl-loop[aria-pressed="true"] { background: var(--green); color: var(--on-green); border-color: var(--green); }

.seg { display: flex; gap: 4px; background: var(--page); border: 1px solid var(--line); border-radius: 12px; padding: 4px; flex-wrap: wrap; }
.seg button { flex: 1 1 auto; border: 0; background: transparent; padding: 8px 10px; border-radius: 9px; font-size: 14px; font-weight: 700; color: var(--muted); cursor: pointer; }
.seg button.on { background: var(--card); color: var(--green); box-shadow: var(--shadow); }

.words { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.word { border: 1px solid var(--line); border-radius: 12px; padding: 10px 10px 10px 12px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.w-en { font-weight: 800; font-size: 17px; line-height: 1.3; overflow-wrap: break-word; hyphens: auto; }
.w-foot { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 2px; }
.w-foot .speak { width: 30px; height: 30px; margin: 0; }
.w-zh { border: 0; background: none; padding: 0; text-align: left; font-size: 15px; cursor: default; }
.tag { justify-self: start; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
.t-noun { color: var(--t-noun); background: var(--t-noun-bg); }
.t-verb { color: var(--t-verb); background: var(--t-verb-bg); }
.t-adj { color: var(--t-adj); background: var(--t-adj-bg); }
.t-link { color: var(--t-link); background: var(--t-link-bg); }
.t-other { color: var(--t-other); background: var(--t-other-bg); }

/* masked = tap to reveal */
.words[data-mode="hide"] .w-zh:not(.revealed),
.sents[data-mode="hide-en"] .s-en:not(.revealed),
.sents[data-mode="hide-zh"] .s-zh:not(.revealed),
.dialog[data-mode="role"] .me .b-en:not(.revealed) { color: transparent; background: var(--line); border-radius: 8px; cursor: pointer; user-select: none; }
.words[data-mode="hide"] .w-zh:not(.revealed)::after,
.sents[data-mode="hide-en"] .s-en:not(.revealed)::after,
.sents[data-mode="hide-zh"] .s-zh:not(.revealed)::after,
.dialog[data-mode="role"] .me .b-en:not(.revealed)::after { content: ""; }
.words[data-mode="hide"] .w-zh, .sents:not([data-mode="all"]) .reveal, .dialog[data-mode="role"] .me .b-en { cursor: pointer; }
.dialog[data-mode="hide-zh"] .b-zh { display: none; }

.formula { font-size: 21px; font-weight: 800; color: var(--green); }
.breakdown { background: var(--mint); border-radius: 12px; padding: 12px; font-size: 15px; line-height: 1.7; }
.examples { display: grid; gap: 4px; }
.sents { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; counter-reset: s; }
.sents li { counter-increment: s; display: grid; grid-template-columns: 26px 1fr auto; gap: 4px 8px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line); }
.sents li::before { content: counter(s); grid-row: span 2; font-family: var(--num); font-weight: 700; color: var(--accent); padding-top: 2px; }
.s-en { font-size: 17.5px; font-weight: 700; padding: 0 4px; }
.s-zh { grid-column: 2; color: var(--muted); font-size: 15px; padding: 0 4px; }
.sents .speak { grid-row: 1; grid-column: 3; }

.dialog { display: grid; gap: 10px; }
.bubble { position: relative; max-width: 88%; padding: 10px 44px 10px 12px; border-radius: 14px; display: grid; gap: 2px; }
.bubble .speak { position: absolute; right: 6px; top: 8px; width: 30px; height: 30px; margin: 0; }
.bubble.them { background: var(--mint); justify-self: start; border-top-left-radius: 4px; }
.bubble.me { background: var(--peach); justify-self: end; border-top-right-radius: 4px; }
.who { font-size: 11px; font-weight: 800; letter-spacing: .08em; color: var(--green-2); }
.me .who { color: var(--accent); }
.b-en { font-weight: 700; font-size: 16.5px; }
.b-zh { font-size: 14px; color: var(--muted); }
.gist { display: grid; gap: 2px; font-size: 15px; }

.task { background: var(--green); color: var(--on-green); border-radius: 14px; padding: 14px; font-weight: 700; font-size: 16px; line-height: 1.6; }
.rec { display: grid; gap: 8px; }
.rec-btn svg { width: 20px; height: 20px; }
.rec.live .rec-btn { background: var(--wrong-bg); color: var(--wrong); }
.rec-out audio { width: 100%; }
.rec-msg { font-size: 13.5px; color: var(--muted); background: var(--page); border-radius: 10px; padding: 10px; }
.tip { background: var(--page); border-radius: 12px; padding: 12px; display: grid; gap: 4px; font-size: 15px; }
.tip.jenny { background: var(--peach); }

.checks { display: grid; gap: 8px; }
[hidden] { display: none !important; }
.chk { position: relative; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; background: var(--card); }
.chk input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.chk .box { flex: none; width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--line); display: grid; place-items: center; color: transparent; }
.chk .box svg { width: 16px; height: 16px; }
.chk input:checked + .box { background: var(--green-2); border-color: var(--green-2); color: var(--on-green); }
.chk input:focus-visible + .box { outline: 3px solid var(--accent-fill); outline-offset: 2px; }
.chk-l { font-size: 15.5px; line-height: 1.45; }
.mood { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }
.mood button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 14px; }
.mood button.on { background: var(--green); color: var(--on-green); border-color: var(--green); }
.extra { display: grid; gap: 6px; margin-top: 8px; }
.pager { display: flex; justify-content: space-between; gap: 10px; }
.pager .btn { flex: 1; }

/* generic docs */
.doc { display: grid; gap: 12px; }
.doc .lead { font-size: 17px; font-weight: 600; line-height: 1.6; }
.num-row { display: grid; grid-template-columns: 34px 1fr; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.nr-n { font-family: var(--num); font-weight: 700; color: var(--accent); font-size: 17px; }
.nr-t { font-weight: 800; font-size: 16.5px; color: var(--green); }
.nr-d { color: var(--muted); font-size: 15px; }
.term { display: grid; gap: 2px 12px; padding: 11px 0; border-bottom: 1px solid var(--line); align-items: center; }
.term.c2 { grid-template-columns: minmax(0, 1fr); }
.term.c3 { grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); }
.term.c3 .tc2 { grid-column: 1 / -1; color: var(--muted); font-size: 14.5px; }
.tc0 { font-weight: 800; color: var(--accent); overflow-wrap: anywhere; display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
.term.c2 .tc0 { color: var(--green); }
.tc1 { font-weight: 700; }
.term.c2 .tc0 { font-size: 17px; }
.term.c2 .tc1 { color: var(--muted); font-weight: 400; font-size: 15px; }
.call { border-radius: 14px; padding: 14px; display: grid; gap: 6px; font-size: 15.5px; }
.tone-E8F1EC { background: var(--mint); }
.tone-FBE7D8 { background: var(--peach); }
.tone-FFFCF6 { background: var(--card); border: 1px solid var(--line); }
.tone-064C39 { background: var(--green); color: var(--on-green); }
.tone-064C39 .label { color: var(--on-green); opacity: .85; }
.pair-chk { display: grid; gap: 4px; }
.field { display: grid; gap: 6px; font-size: 14px; font-weight: 700; color: var(--muted); }

.field input, .field textarea { font: inherit; font-size: 16px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; }

.idcard dd { margin: 0; font-weight: 700; overflow-wrap: anywhere; }
.blank { color: var(--muted); font-weight: 400; }

/* quiz + final */
.quiz, .plain { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.q, .plain > li { display: grid; gap: 8px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }

.opt { display: flex; gap: 10px; align-items: center; text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); cursor: pointer; font-size: 15.5px; }
.opt b { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--page); display: grid; place-items: center; font-size: 13px; font-family: var(--num); }
.opt.right { background: var(--right-bg); border-color: var(--right); color: var(--right); font-weight: 700; }
.opt.wrong { background: var(--wrong-bg); border-color: var(--wrong); color: var(--wrong); }
.opt:disabled { cursor: default; }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 58px); background: var(--page); z-index: 4; padding-top: 4px; }
.tabs button { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 12px; font-size: 13.5px; font-weight: 700; cursor: pointer; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--green); color: var(--on-green); border-color: var(--green); }
#part { display: grid; gap: 14px; }
.dir { background: var(--mint); border-radius: 12px; padding: 12px; display: grid; gap: 2px; font-size: 15px; }
.passage { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 8px; }
.passage h3 { font-size: 14px; letter-spacing: .06em; color: var(--accent); }
.passage p { font-size: 16.5px; line-height: 1.75; }
.ans summary { cursor: pointer; color: var(--green-2); font-weight: 700; font-size: 14px; }
.ans p { margin-top: 4px; font-weight: 700; }
.hints { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 15px; }
.hints span { display: block; color: var(--muted); font-size: 14px; }
.wstats { font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pic { width: 100%; border-radius: 14px; }
.frames { display: grid; gap: 8px; grid-template-columns: 1fr 1fr; }
.frame { border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
.result { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 8px; }
.big { font-family: var(--num); font-size: 48px; font-weight: 700; color: var(--green); line-height: 1; }
.big span { font-size: 20px; color: var(--muted); }
.rt { width: 100%; border-collapse: collapse; font-size: 15px; font-variant-numeric: tabular-nums; }
.rt td { padding: 8px 0; border-bottom: 1px solid var(--line); }

@media (max-width: 380px) {
  .words { grid-template-columns: 1fr; }

}
@media (prefers-reduced-motion: no-preference) {
  .rt-fill, .rt-plane { transition: all .6s ease; }
}

/* per-item audio */
.audiobar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.playall { min-height: 40px; padding: 8px 14px; font-size: 14.5px; }
.playall svg { width: 18px; height: 18px; }

.slowtg[aria-pressed="true"] { background: var(--peach); color: var(--accent); border-color: transparent; }

/* numbers */
.numgroup { display: grid; gap: 8px; margin-top: 6px; }

.numgrid.g1 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.numgrid.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

 seven","zh":"菲律宾手机号：分组读","a":"num5-2.mp3"},{"n":"650 pesos","en":"six hundred fifty pesos","zh":"价格","a":"num5-3.mp3"},{"n":"1,250 pesos","en":"one thousand two hundred fifty pesos","zh":"价格","a":"num5-4.mp3"},{"n":"8:30","en":"eight thirty","zh":"时间","a":"num5-5.mp3"},{"n":"2026","en":"twenty twenty-six","zh":"年份","a":"num5-6.mp3"}]}],"grammar":[{"id":1,"day":1,"title":"am / is / are","sub":"“是 / 在”怎么说","rule":"说“是谁、在哪里、怎么样”用 be 动词。I 用 am；he / she / it 和一个人、一个东西用 is；you / we / they 和两个以上用 are。","table":[["I","am"],["he / she / it / 一个人或东西","is"],["you / we / they / 两个以上","are"]],"ex":[["I am from China.","我来自中国。"],["She is my teacher.","她是我的老师。"],["They are in Room 201.","他们在 201 教室。"]],"tip":"口语常用缩写：I'm、she's、they're。","quiz":[["I ___ a student.",["am","is","are"],0],["My room ___ on the third floor.",["am","is","are"],1],["We ___ ready.",["am","is","are"],2]],"exA":["g1-1.mp3","g1-2.mp3","g1-3.mp3"]},{"id":2,"day":3,"title":"at / in / on","sub":"时间和地点","rule":"时间：几点用 at，星期和日期用 on，月份、年份、上午下午用 in。地点：一个点用 at，在里面用 in，在某一层或表面上用 on。","table":[["at","at 8:00 / at the airport"],["on","on Monday / on the second floor"],["in","in May / in the morning / in the classroom"]],"ex":[["My class starts at 8:00.","我的课 8 点开始。"],["See you on Monday.","星期一见。"],["Room 201 is on the second floor.","201 在二楼。"]],"tip":"先判断是时间还是地点，再选 at / on / in。","quiz":[["The test is ___ Monday.",["at","in","on"],2],["I wake up ___ seven.",["at","in","on"],0],["My class is ___ the morning.",["at","in","on"],1]],"exA":["day03-s2.mp3","g2-2.mp3","g2-3.mp3"]},{"id":3,"day":9,"title":"can / want to / would like to","sub":"后面跟动词原形","rule":"can（能）、want to（想）、would like to（想要，更礼貌）后面的动词用原形：不加 -s、不加 -ed、不加 -ing。","table":[["can + 动词原形","Can I pay by card?"],["want to + 动词原形","I want to improve my English."],["would like to + 动词原形","I'd like to pay in cash."]],"ex":[["Can I pay by card?","可以刷卡吗？"],["I want to improve my English.","我想提高英语。"],["I'd like to pay in cash.","我想付现金。"]],"tip":"I'd like = I would like，点餐、买东西时比 I want 更礼貌。","quiz":[["She can ___ English.",["speak","speaks","speaking"],0],["I want to ___ my speaking.",["improve","improved","improving"],0],["Can you ___ that again?",["say","said","says"],0]],"exA":["day10-s4.mp3","day01-s4.mp3","day12-try.mp3"]},{"id":4,"day":10,"title":"a / an / the 和复数 -s","sub":"一个、那个、很多个","rule":"第一次提到、只有一个：用 a；开头是元音音（a e i o u 的音）用 an。双方都知道是哪一个：用 the。两个以上：名词加 -s。","table":[["a","a bottle / a card"],["an","an apple / an hour（看发音）"],["the","the exit / the Wi-Fi password"],["-s","two bottles / three tissues"]],"ex":[["Do you have a phone charger?","有手机充电器吗？"],["I'd like two bottles.","我想要两瓶。"],["Where is the exit?","出口在哪里？"]],"tip":"听不出来也没关系，先把 a 和 -s 说出来，意思就清楚了。","quiz":[["I have ___ question.",["a","an"],0],["It takes ___ hour.",["a","an"],1],["I'd like three ___.",["bottle","bottles"],1]],"exA":["day10-s3.mp3","day10-s2.mp3","day04-ex2.mp3"]},{"id":5,"day":25,"title":"and / but / because / so","sub":"把两句连成一句","rule":"and 是“和、还有”，but 是“但是”，because 后面接原因，so 后面接结果。回答和写作用上它们，句子马上变长。","table":[["and","I have dinner and study English."],["but","My work is busy, but I like it."],["because","I like it because it helps me relax."],["so","I was tired, so I went to bed early."]],"ex":[["I have dinner and study English.","我吃晚饭，然后学英语。"],["My work is busy, but I like it.","我的工作很忙，但我喜欢。"],["I was tired, so I went to bed early.","我很累，所以早早睡了。"]],"tip":"because 接原因，so 接结果，不要两个一起用。","quiz":[["I like cooking ___ it is relaxing.",["because","but"],0],["I was tired, ___ I went to bed early.",["so","because"],0],["The class is fast, ___ I can follow.",["but","because"],0]],"exA":["g5-1.mp3","g5-2.mp3","g5-3.mp3"]},{"id":6,"day":26,"title":"do / does","sub":"问句和否定","rule":"问“你平时……吗”用 Do 开头；问 he / she 用 Does。否定在动词前加 don't / doesn't。用了 does 或 doesn't，后面的动词就不加 -s。","table":[["问句","Do you ...? / Does she ...?"],["否定","I don't ... / She doesn't ..."],["特殊问句","Where do you ...? / What does he ...?"]],"ex":[["Do you like cooking?","你喜欢做饭吗？"],["Where do you usually have lunch?","你通常在哪里吃午饭？"],["I don't understand this part.","这部分我不明白。"]],"tip":"回答 Do you ...? 可以说 Yes, I do. / No, I don't.","quiz":[["___ you live with your parents?",["Do","Does"],0],["___ she work on weekends?",["Do","Does"],1],["He doesn't ___ coffee.",["like","likes"],0]],"exA":["g6-1.mp3","g6-2.mp3","day19-s2.mp3"]},{"id":7,"day":32,"title":"there is / there are","sub":"“某处有……”","rule":"说“某个地方有……”：后面是一个东西用 there is，两个以上用 there are。没有就说 there is no / there are no。","table":[["there is + 一个","There is a clinic near the school."],["there are + 两个以上","There are four people in my family."],["没有","There is no hot water."]],"ex":[["There are four people in my family.","我家有四口人。"],["There is no hot water.","没有热水。"],["On the left, there is a teacher.","左边有一位老师。"]],"tip":"看图说话很常用：In the picture, there are two students.","quiz":[["There ___ a clinic near the school.",["is","are"],0],["There ___ two students in the picture.",["is","are"],1],["There ___ no towels in my room.",["is","are"],1]],"exA":["g7-1.mp3","day08-s3.mp3","day53-ex1.mp3"]},{"id":8,"day":33,"title":"一般现在时：he / she 加 -s","sub":"说习惯和事实","rule":"说平时的习惯、工作和事实，用动词原形。主语是 he / she / it 或一个人时，动词要加 -s。","table":[["I / you / we / they","work / study / have"],["he / she / it / 一个人","works / studies / has"],["特别注意","go → goes，do → does，have → has"]],"ex":[["I work in sales.","我做销售。"],["She works in a hotel.","她在酒店工作。"],["My class starts at 8:00.","我的课 8 点开始。"]],"tip":"入学测试很爱考这一点：She ___ English every day. 选 studies。","quiz":[["She ___ English every day.",["study","studies","studied"],1],["He ___ two children.",["have","has"],1],["They ___ lunch at noon.",["eat","eats"],0]],"exA":["g8-1.mp3","g8-2.mp3","day03-s2.mp3"]},{"id":9,"day":40,"title":"一般过去时","sub":"昨天、上周、去年","rule":"说已经发生的事，动词用过去式。大部分动词加 -ed；最常用的几个不规则，要单独记。","table":[["加 -ed","work → worked，watch → watched，study → studied"],["不规则","go → went，have → had，see → saw，eat → ate，feel → felt"],["问句","Did you ...?（后面用原形）"]],"ex":[["Yesterday I went to the mall ,"zh":"请排队（菲律宾很常见的说法）","ex":"Please fall in line.","exzh":"请排队。","a":"local-10.mp3"},{"t":"Out of order","zh":"（机器、设备）坏了，暂停使用","ex":"The washing machine is out of order.","exzh":"洗衣机坏了。","a":"local-11.mp3"},{"t":"Fare","zh":"车费（坐吉普尼、出租车时用）","ex":"How much is the fare?","exzh":"车费多少钱？","a":"local-12.mp3"}],"pron":[{"title":"th 和 s / t","tip":"舌尖轻轻放在上下牙之间，往外吹气。不要读成 s 或 t。","pairs":[["think","sink"],["three","tree"],["thank","tank"]],"a":[["day28-w2.mp3","pron1-1b.mp3"],["num1-4.mp3","pron1-2b.mp3"],["pron1-3a.mp3","pron1-3b.mp3"]]},{"title":"v 和 w","tip":"v：上牙轻碰下唇，有震动；w：嘴唇圆起来，不碰牙。","pairs":[["very","wary"],["vest","west"],["vine","wine"]],"a":[["pron2-1a.mp3","pron2-1b.mp3"],["pron2-2a.mp3","pron2-2b.mp3"],["pron2-3a.mp3","pron2-3b.mp3"]]},{"title":"l 和 r","tip":"l：舌尖顶住上牙后面；r：舌尖不碰任何地方，往后卷一点。","pairs":[["light","right"],["long","wrong"],["glass","grass"]],"a":[["pron3-1a.mp3","day06-w4.mp3"],["pron3-2a.mp3","pron3-2b.mp3"],["pron3-3a.mp3","pron3-3b.mp3"]]},{"title":"短元音和长元音","tip":"短音短促，长音拉长一点，意思完全不同。","pairs":[["ship","sheep"],["live","leave"],["full","fool"]],"a":[["pron4-1a.mp3","pron4-1b.mp3"],["pron4-2a.mp3","pron4-2b.mp3"],["pron4-3a.mp3","pron4-3b.mp3"]]},{"title":"词尾辅音","tip":"词尾的 d / t / k 要轻轻收住，不要吞掉，也不要多加一个“额”。","pairs":[["bed","bet"],["card","cart"],["bag","back"]],"a":[["pron5-1a.mp3","pron5-1b.mp3"],["day12-w3.mp3","pron5-2b.mp3"],["pron5-3a.mp3","pron5-3b.mp3"]]},{"title":"-teen 和 -ty","tip":"-teen 重音在后：thir-TEEN；-ty 重音在前：THIR-ty。听价格和房号时最容易错。","pairs":[["thirteen","thirty"],["fifteen","fifty"],["eighteen","eighty"]],"a":[["day02-w5.mp3","day02-w2.mp3"],["num1-16.mp3","num2-3.mp3"],["num1-19.mp3","num2-6.mp3"]]}],"method":{"steps":[["复习昨天","5 分钟","首页“今天要复习”点进去，遮住英文，把 4 句说一遍。"],["听音跟读","10 分钟","每个单词、每句话点一下：听 1 遍，跟读 3 遍。"],["替换造句","5 分钟","按“句子骨架”，把姓名、地点、时间换成自己的。"],["对话演练","5 分钟","点“我来演学生”，先自己说，再点开对答案。"],["录音打卡","5 分钟","录一遍今天的任务，打勾完成。"]],"ways":[["影子跟读","点播放，晚半拍跟着说。先看文字跟 3 遍，再不看文字跟 2 遍。"],["遮住英文说出来","只看中文说英文。卡住就看一眼，遮住再说一遍。"],["替换造句","按句子骨架换姓名、地点、时间或原因，每句至少换 3 who, what, where, when, why, how","ex":"Where is the clinic?","hl":"Where","exzh":"诊所在哪里？","a":"pos-9.mp3"}],"build":{"rule":"一个英语句子，最基本的顺序是：谁（主语）+ 做什么 / 是什么（动词）+ 其他（什么、在哪里、什么时候）。","ex":[[["I","谁"],["study","做什么"],["English every day.","其他"]],[["She","谁"],["is","是"],["my teacher.","其他"]],[["My class","谁"],["starts","做什么"],["at 8:00.","什么时候"]]]},"quiz":[["I study English. 里的 study 是什么词？",["名词","动词","形容词"],1],["She is busy. 里的 busy 是什么词？",["形容词","副词","介词"],0],["Please speak slowly. 里的 slowly 是什么词？",["动词","副词","名词"],1],["The test is on Monday. 里的 on 是什么词？",["介词","连词","代词"],0],["They are in Room 201. 里的 They 是什么词？",["名词","代词","冠词"],1]],"buildA":["pos-3.mp3","g1-2.mp3","day03-s2.mp3"]},"final":{"sq1":"day31-d1.mp3","sq2":"final-sq2.mp3","sq3":"final-sq3.mp3","sq4":"final-sq4.mp3","sq5":"final-sq5.mp3","cq1":"final-cq1.mp3","cq2":"final-cq2.mp3","cq3":"final-cq3.mp3"},"listenScript":[{"who":"","t":"Part one. Listen to the announcement."},{"who":"STAFF","t":"Good morning, new students, and welcome to the school."},{"who":"STAFF","t":"Orientation starts at nine o'clock this morning. Not ten. Nine o'clock."},{"who":"STAFF","t":"It is in Room 201."},{"who":"STAFF","t":"Please bring your passport and a pen."},{"who":"STAFF","t":"Room 201 is on the second floor, next to the library. See you there."},{"who":"","t":"Part two. Listen to the phone call."},{"who":"DRIVER","t":"Hi, is this Jenny? This is your school driver."},{"who":"STUDENT","t":"Yes, this is Jenny. Where are you?"},{"who":"DRIVER","t":"I'm outside Gate 2. My car is white. The plate number is ABC 532."},{"who":"STUDENT","t":"Sorry, could you repeat the plate number?"},{"who":"DRIVER","t":"Sure. ABC 532."},{"who":"STUDENT","t":"Thank you. How long will it take to get to the school?"},{"who":"DRIVER","t":"About ten minutes."}]}</script>
<script>
/* 思达启航 · 菲律宾游学前60天 英语学习网页版 */
(function () {
  'use strict';
  var DATA = JSON.parse(document.getElementById('course-data').textContent);
  var app = document.getElementById('app');

  /* ---------- storage (per device, safe) ---------- */
  var mem = {};
  var KEY = 'sida60:';
  function load(k, d) {
    try { var v = localStorage.getItem(KEY + k); if (v != null) return JSON.parse(v); } catch (e) {}

  }

  /* ---------- helpers ---------- */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function today() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function daysBetween(a, b) { return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000); }
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  var DAYS = DATA.days;
  function dayById(n) { return DAYS[n - 1]; }
  function isEnglish(t) { var a = (t.match(/[A-Za-z]/g) || []).length; return a >= 4 && a / t.replace(/\s/g, '').length > 0.6; }

  var ICON = {
    play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>',
    pause: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/></svg>',
    speak: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
    back: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    check: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    mic: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3.5" width="6" height="11" rx="3" fill="currentColor"/><path d="M6 11.5a6 6 0 0 0 12 0M12 17.5v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
    plane: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15.5v-2l-8-5V3.8a1.5 1.5 0 0 0-3 0V8.5l-8 5v2l8-2.5V18l-2 1.5V21l3.5-1 3.5 1v-1.5L13 18v-5z" fill="currentColor"/></svg>',
    loop: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10a5 5 0 0 1 5-5h7m0 0l-3-3m3 3l-3 3M19 14a5 5 0 0 1-5 5H7m0 0l3 3m-3-3l3-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  };

  /* ---------- progress state ---------- */
  function progress() { return load('progress', { done: {}, reviews: {} }); }
  function setDone(n) { var p = progress(); if (!p.done[n]) p.done[n] = today(); save('progress', p); save('last', n); }
  function doneCount() { return Object.keys(progress().done).length; }
  function nextDay() {
    var p = progress();
    for (var i = 1; i <= 60; i++) if (!p.done[i]) return i;
    return 60;
  }
  /* 隔天复习：学完后的第2、4、7天 = 学完日 +1、+3、+6 */
  var REVIEW_GAPS = [1, 3, 6];
  function dueReviews() {
    var p = progress(), t = today(), due = [];
    Object.keys(p.done).forEach(function (k) {
      var gap = daysBetween(p.done[k], t);
      if (REVIEW_GAPS.indexOf(gap) > -1 && !(p.reviews[k] && p.reviews[k].indexOf(t) > -1)) due.push(+k);
    });
    return due.sort(function (a, b) { return a - b; });
  }
  function markReviewed(n) { var p = progress(); p.reviews[n] = p.reviews[n] || []; if (p.reviews[n].indexOf(today()) < 0) p.reviews[n].push(today()); save('progress', p); }

  /* ---------- one clip per item (American voice recordings) ---------- */
  var clip = new Audio(); clip.preload = 'auto';
  /* preview build packs clips into per-day bundles; the website build uses one mp3 per item */
  var BUNDLED = !!window.__CLIPMAP__, clipData = {}, bundleLoading = {};
  function loadBundle(key) {
    if (!bundleLoading[key]) bundleLoading[key] = fetch('bundles/' + key + '.json').then(function (r) { return r.json(); }).then(function (j) { Object.keys(j).forEach(function (k) { clipData[k] = 'data:audio/mpeg;base64,' + j[k]; }); }).catch(function () { delete bundleLoading[key]; });
    return bundleLoading[key];
  }
  function prefetchClips(root) {
    if (!BUNDLED) return;
    var keys = {};
    $$('[data-clip]', root).forEach(function (b) { var k = window.__CLIPMAP__[b.getAttribute('data-clip')]; if (k) keys[k] = 1; });
    Object.keys(keys).forEach(loadBundle);
  }
  function clipSrc(file) { return BUNDLED ? clipData[file] : 'audio/' + file; }
  var clipBtnEl = null, queue = [], queueBtn = null;
  function slow() { return !!load('slow', false); }
  function clearPlaying() { if (clipBtnEl) clipBtnEl.classList.remove('playing'); $$('.now').forEach(function (e) { e.classList.remove('now'); }); }
  function playClip(file, btn, hl) {
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    clip.pause(); clearPlaying();
    clipBtnEl = btn || null; if (btn) btn.classList.add('playing'); if (hl) hl.classList.add('now');
    var src = clipSrc(file);
    if (!src) { var k = window.__CLIPMAP__[file]; if (k) loadBundle(k).then(function () { if (clipData[file]) playClip(file, btn, hl); else clearPlaying(); }); return; }
    clip.src = src; clip.playbackRate = slow() ? 0.8 : 1;
    var p = clip.play(); if (p && p.catch) p.catch(function () { clearPlaying(); });
  }
  clip.addEventListener('ended', function () {
    clearPlaying();
    if (queue.length) { var n = queue.shift(); setTimeout(function () { playClip(n.a, n.btn, n.el); }, 450); }
    else if (queueBtn) { queueBtn.classList.remove('on'); queueBtn = null; }
  });
  function stopClips() { queue = []; if (queueBtn) { queueBtn.classList.remove('on'); queueBtn = null; } clip.pause(); clearPlaying(); }
  function speakBtn(file, label) {
    if (!file) return '';
    return '<button type="button" class="speak" data-clip="' + esc(file) + '" aria-label="' + esc(label || '播放') + '">' + ICON.speak + '</button>';
  }
  function playAllBtn(scope, label) { return '<button type="button" class="btn btn-ghost playall" data-playall="' + scope + '">' + ICON.play + '<span>' + esc(label) + '</span></button>'; }
  function startQueue(scopeEl, btn) {
    stopClips();
    var items = $$('[data-clip]', scopeEl).map(function (b) { return { a: b.getAttribute('data-clip'), btn: b, el: b.closest('[data-item]') }; });
    if (!items.length) return;
    queueBtn = btn; btn.classList.add('on');
    var f = items.shift(); queue = items; playClip(f.a, f.btn, f.el);
  }

  /* ---------- audio player ---------- */
  var currentAudio = null;
  function player(src, title, note) {
    return '<div class="player" data-src="audio/' + esc(src) + '">' +
      '<button type="button" class="pl-btn" aria-label="播放">' + ICON.play + '</button>' +
      '<div class="pl-main"><div class="pl-title">' + esc(title) + '</div>' +
      '<input class="pl-bar" type="range" min="0" max="1000" value="0" aria-label="播放进度">' +

  function wireRecorders(root) {

  function wireQuiz(id, qs, onDone) {
    var ans = load('quiz:' + id, {});

        });
        if (onDone) onDone();
      });
    });
  }

      x = dir('Choose the correct word to complete each sentence.', '先圈时间词，再看空格前后需要哪一种词。') + '<div data-quiz="grammar">' + quizHTML('grammar', GRAMMAR) + '</div>';

  /* ---------- router ---------- */
  function route() {
    stopAudio();

    if ((m = hsh.match(/^day-(\d+)$/))) renderDay(+m[1]);
    else if ((m = hsh.match(/^page-(\d+)$/))) renderPage(m[1]);
    else if ((m = hsh.match(/^weekly-(\d+)$/))) renderWeekly(+m[1]);
    else if ((m = hsh.match(/^levelup-(\d+)$/))) renderLevelUp(+m[1]);
    else if (hsh === 'final') renderFinal();
    else if (hsh === 'selfcheck') renderSelfCheck();
    else if (hsh === 'info') renderInfo();
    else if (hsh === 'numbers') renderNumbers();
    else if ((m = hsh.match(/^grammar-(\d+)$/))) renderGrammar(+m[1]);
    else if (hsh === 'local') renderLocal();
    else if (hsh === 'pron') renderPron();
    else if (hsh === 'method') renderMethod();
    else if (hsh === 'tags') renderTags();
    else if (hsh === 'cards') renderCards();
    else { renderHome(); if (hsh === 'contact') { var c = $('#contact'); if (c) { c.scrollIntoView(); return; } } }
    prefetchClips(app);

  }
  document.addEventListener('click', function (e) {
    var s = e.target.closest('[data-clip]'); if (s) { e.preventDefault(); e.stopPropagation(); if (s.classList.contains('playing')) { stopClips(); return; } queue = []; playClip(s.getAttribute('data-clip'), s, s.closest('[data-item]')); return; }
    var c = e.target.closest('[data-copy]');
    if (c) {
      var v = c.getAttribute('data-copy');
      var ok = function () { c.textContent = '已复制'; setTimeout(function () { c.textContent = '复制号码'; }, 1600); };
      var fallback = function () { var sel = $('.sel'); if (sel) { var r = document.createRange(); r.selectNodeContents(sel); var w = window.getSelection(); w.removeAllRanges(); w.addRange(r); c.textContent = '已选中，长按复制'; } };
      try { navigator.clipboard.writeText(v).then(ok, fallback); } catch (err) { fallback(); }
    }
  });
  window.addEventListener('hashchange', route);
  route();
})();
