<button
  type="button"
  class="expandable-image__trigger"
  [class.expandable-image__trigger--disabled]="disabled"
  [attr.aria-label]="'查看大图：' + (alt || title || '图片')"
  [disabled]="disabled"
  (click)="open()"
>
  <img
    [src]="src"
    [alt]="alt || title"
    [style.height]="previewHeight || null"
    [style.min-height]="previewMinHeight || null"
    [style.object-fit]="previewFit || null"
    [attr.loading]="loading"
  />
  <span class="expandable-image__zoom" aria-hidden="true">
    <mat-icon>zoom_in</mat-icon>
  </span>
  <span *ngIf="hasMultipleImages" class="expandable-image__count" aria-hidden="true">
    <mat-icon>collections</mat-icon>
    {{ imageSources.length }}张
  </span>
</button>

<div
  *ngIf="isOpen"
  class="expandable-image__overlay"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="activeTitle || activeAlt || '图片预览'"
  (click)="close()"
>
  <button type="button" class="expandable-image__close" aria-label="关闭图片预览" (click)="close($event)">
    <mat-icon>close</mat-icon>
  </button>

  <div
    class="expandable-image__viewer"
    [class.expandable-image__viewer--single]="!hasMultipleImages"
    (click)="stopClose($event)">
    <button
      *ngIf="hasMultipleImages"
      type="button"
      class="expandable-image__nav expandable-image__nav--previous"
      [attr.aria-label]="'查看上一张图片'"
      (click)="previous($event)"
    >
      <mat-icon>chevron_left</mat-icon>
    </button>

    <figure
      class="expandable-image__figure"
      (touchstart)="startTouch($event)"
      (touchend)="endTouch($event)"
    >
      <img [src]="activeSrc" [alt]="activeAlt || activeTitle || '图片预览'" />
      <figcaption *ngIf="activeTitle || activeCaption || hasMultipleImages">
        <div>
          <strong *ngIf="activeTitle">{{ activeTitle }}</strong>
          <span *ngIf="activeCaption">{{ activeCaption }}</span>
        </div>
        <span *ngIf="hasMultipleImages" class="expandable-image__counter">
          {{ activeIndex + 1 }} / {{ imageSources.length }}
        </span>
      </figcaption>
    </figure>

    <button
      *ngIf="hasMultipleImages"
      type="button"
      class="expandable-image__nav expandable-image__nav--next"
      [attr.aria-label]="'查看下一张图片'"
      (click)="next($event)"
    >
      <mat-icon>chevron_right</mat-icon>
    </button>
  </div>
</div>
