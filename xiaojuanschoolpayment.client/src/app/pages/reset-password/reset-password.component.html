<main class="auth-page">
  <section class="auth-shell" aria-labelledby="reset-title">
    <a class="auth-brand" routerLink="/" aria-label="返回思达启航首页">
      <img src="/assets/sida-qihang-quote-header-logo-transparent.webp" alt="思达启航教育｜留学规划、语言提升，从思达启航，走向更美好的未来" />
    </a>

    <div class="auth-card">
      <div class="auth-copy">
        <span class="auth-eyebrow">账号安全</span>
        <h1 id="reset-title">重置登录密码</h1>
        <p *ngIf="!invalidLink && !completed">为 {{ email }} 设置一个新密码。</p>
      </div>

      <div *ngIf="invalidLink" class="status-panel error-panel" role="alert">
        <mat-icon>link_off</mat-icon>
        <h2>重置链接无效</h2>
        <p>链接信息不完整，请返回登录页重新申请密码重置邮件。</p>
        <a class="primary-button button-link" routerLink="/login">返回登录</a>
      </div>

      <div *ngIf="completed" class="status-panel" role="status">
        <mat-icon>check_circle</mat-icon>
        <h2>密码已更新</h2>
        <p>现在可以使用邮箱或已登记的手机号码和新密码登录。</p>
        <a class="primary-button button-link" routerLink="/login">前往登录</a>
      </div>

      <form *ngIf="!invalidLink && !completed" [formGroup]="resetForm" (ngSubmit)="onSubmit()" novalidate>
        <label class="field-label" for="new-password">新密码</label>
        <div class="auth-input" [class.invalid]="resetForm.get('newPassword')?.invalid && resetForm.get('newPassword')?.touched">
          <mat-icon>lock_outline</mat-icon>
          <input id="new-password" formControlName="newPassword" [type]="hidePassword ? 'password' : 'text'" placeholder="至少8位，包含数字" autocomplete="new-password" />
          <button class="visibility-button" type="button" (click)="hidePassword = !hidePassword" [attr.aria-label]="hidePassword ? '显示密码' : '隐藏密码'">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>
        <p class="field-error" *ngIf="resetForm.get('newPassword')?.invalid && resetForm.get('newPassword')?.touched">密码至少8位，并包含一个数字</p>

        <label class="field-label" for="confirm-password">确认新密码</label>
        <div class="auth-input" [class.invalid]="(resetForm.get('confirmPassword')?.invalid || resetForm.hasError('passwordMismatch')) && resetForm.get('confirmPassword')?.touched">
          <mat-icon>lock_reset</mat-icon>
          <input id="confirm-password" formControlName="confirmPassword" [type]="hideConfirmation ? 'password' : 'text'" placeholder="请再次输入新密码" autocomplete="new-password" />
          <button class="visibility-button" type="button" (click)="hideConfirmation = !hideConfirmation" [attr.aria-label]="hideConfirmation ? '显示密码' : '隐藏密码'">
            <mat-icon>{{ hideConfirmation ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>
        <p class="field-error" *ngIf="resetForm.hasError('passwordMismatch') && resetForm.get('confirmPassword')?.touched">两次输入的密码不一致</p>

        <button class="primary-button" type="submit" [disabled]="loading">
          {{ loading ? '正在更新…' : '更新密码' }}
          <mat-icon *ngIf="!loading">arrow_forward</mat-icon>
        </button>
      </form>
    </div>

    <p class="back-home"><a routerLink="/login"><mat-icon>arrow_back</mat-icon>返回登录</a></p>
  </section>
</main>
