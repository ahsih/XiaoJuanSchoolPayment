<div class="admin-shell">
  <aside class="sidebar">
    <a class="brand" routerLink="/admin" aria-label="返回员工后台首页">
      <img
        src="/assets/sida-qihang-navbar-logo.jpg"
        alt="思达启航教育 SIDA Qihang Education"
      />
      <span class="admin-badge">员工后台</span>
    </a>

    <nav class="sidebar-navigation" aria-label="员工后台导航">
      <section class="nav-section">
        <p class="nav-label">学校管理</p>
        <a
          routerLink="/admin"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <mat-icon>space_dashboard</mat-icon>
          <span>学校工作台</span>
        </a>
        <a *ngIf="isPublisher" routerLink="/admin/reviews" routerLinkActive="active">
          <mat-icon>fact_check</mat-icon>
          <span>审核与发布</span>
        </a>
      </section>

      <section class="nav-section">
        <p class="nav-label">学生管理</p>
        <a *ngIf="canUse('students')" routerLink="/admin/student-applications" routerLinkActive="active">
          <mat-icon>folder_shared</mat-icon>
          <span>学生申请与档案</span>
        </a>
      </section>

      <section class="nav-section">
        <p class="nav-label">员工管理</p>
        <a *ngIf="isAdmin" routerLink="/admin/staff-permissions" routerLinkActive="active">
          <mat-icon>admin_panel_settings</mat-icon>
          <span>员工与权限</span>
        </a>
        <a routerLink="/admin/invitations" routerLinkActive="active">
          <mat-icon>person_add</mat-icon>
          <span>邀请码管理</span>
        </a>
      </section>

      <section class="nav-section tools-section" *ngIf="isPublisher">
        <p class="nav-label">更多工具</p>
        <details class="legacy-navigation">
          <summary>
            <mat-icon>inventory_2</mat-icon>
            <span>旧版基础资料</span>
            <mat-icon class="summary-arrow">expand_more</mat-icon>
          </summary>
          <p>仅供尚未接入统一工作台的学校使用</p>
          <a routerLink="/admin/school-lessons" routerLinkActive="active">
            <mat-icon>menu_book</mat-icon>
            <span>课程基础数据</span>
          </a>
          <a routerLink="/admin/school-rooms" routerLinkActive="active">
            <mat-icon>bed</mat-icon>
            <span>住宿基础数据</span>
          </a>
          <a routerLink="/admin/school-fees" routerLinkActive="active">
            <mat-icon>receipt_long</mat-icon>
            <span>费用基础数据</span>
          </a>
          <a routerLink="/admin/school-notes" routerLinkActive="active">
            <mat-icon>description</mat-icon>
            <span>学校说明</span>
          </a>
        </details>
      </section>
    </nav>

    <button class="logout-button" type="button" (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>{{ 'admin.layout.logout' | t }}</span>
    </button>
  </aside>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
